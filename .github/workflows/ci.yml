name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core und Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/RatioVPN.Core -c Release
      - run: dotnet run --project tests/RatioVPN.Tests -c Release

  app:
    name: Windows-App bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/RatioVPN.App/RatioVPN.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: RatioVPN-win-x64
          path: publish/
